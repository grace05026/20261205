const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 背景散景微光（減少動態效果時不顯示） */
(() => {
  if(reduce) return;
  const wrap = document.createElement("div"); wrap.className = "bokeh"; wrap.setAttribute("aria-hidden","true");
  for(let i=0;i<12;i++){
    const s = document.createElement("span"), d = 28+Math.random()*72;
    s.style.cssText = `width:${d}px;height:${d}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${22+Math.random()*26}s;animation-delay:${-Math.random()*40}s;--o:${(.1+Math.random()*.12).toFixed(2)}`;
    wrap.appendChild(s);
  }
  document.body.prepend(wrap);
})();

/* 測試模式：網址含 ?test=1（或 #test）才啟用；正式網址完全不顯示 */
const TEST = (() => { try { return new URLSearchParams(location.search).get("test") === "1" || location.hash === "#test"; } catch(e){ return false; } })();
if(TEST){ $("testbar").hidden = false; document.body.classList.add("t"); }

/* 拆封紀錄（測試模式一律忽略、也不寫入） */
const STORAGE_VERSION = "v2";  /* 之後若又測試過，改成 v3、v4… 即可讓所有舊的拆封紀錄失效 */
const KEY = id => "wedding-opened-" + STORAGE_VERSION + ":" + id;
function wasOpened(id){ if(TEST) return false; try{ return localStorage.getItem(KEY(id)) === "1"; }catch(e){ return false; } }
function markOpened(id){ if(TEST) return; try{ localStorage.setItem(KEY(id), "1"); }catch(e){} }

/* 解密工具（名單與信件在原始碼中皆為密文） */
const SALT = new TextEncoder().encode("luka-grace-2026"), TE = new TextEncoder(), TD = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function idOf(name){
  const h = await crypto.subtle.digest("SHA-256", TE.encode("id|" + name));
  return [...new Uint8Array(h)].slice(0,12).map(x => x.toString(16).padStart(2,"0")).join("");
}
async function unlock(blob, pw){
  const km = await crypto.subtle.importKey("raw", TE.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const raw = b64(blob);
  return TD.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0,12)}, key, raw.slice(12)));
}

/* 座位圖 */
[[[16,22],[23,29]],[[1,7],[8,14]]].forEach(col => {
  const c = document.createElement("div"); c.className = "col";
  col.forEach(([a,b]) => {
    const s = document.createElement("div"); s.className = "strip";
    for(let n=a;n<=b;n++){ const t = document.createElement("div"); t.className = "tb"; t.dataset.t = n; t.textContent = n; s.appendChild(t); }
    c.appendChild(s);
  });
  $("floor").appendChild(c);
});
function mark(t){
  document.querySelectorAll(".tb.me").forEach(e => e.classList.remove("me"));
  const el = t && document.querySelector('.tb[data-t="'+t+'"]'); if(el) el.classList.add("me");
}

let cur = null, seq = 0;
const NOTFOUND = "找不到名字或有任何問題，請當天現場詢問✨";
function say(t){ const h = $("hint"); h.textContent = t; h.hidden = false; }
async function run(){
  const v = $("q").value.normalize("NFC").trim(), my = ++seq;
  mark(null); $("card").hidden = true; cur = null;
  if(!v){ say("請先輸入姓名喔。"); return; }
  if(!(window.crypto && crypto.subtle)){ say(NOTFOUND); return; }
  try{
    const id = await idOf(v), rec = DATA.find(r => r.i === id);
    if(!rec){ if(my === seq) say(NOTFOUND); return; }
    const table = await unlock(rec.t, "n|" + v);   /* 名字不對就解不開 */
    if(my === seq) show({name:v, table, rec});
  }catch(e){ if(my === seq) say(NOTFOUND); }
}
function show(g){
  cur = g; $("hint").hidden = true;
  $("gname").textContent = g.name; $("gtable").textContent = g.table;
  const done = wasOpened(g.rec.i);
  const env = $("env"); env.classList.remove("open"); env.setAttribute("aria-expanded","false");
  $("letter").classList.remove("show"); $("envlabel").hidden = false; $("envhint").hidden = false;
  $("egg").hidden = done; $("opened").hidden = !done;
  $("msg").textContent = ""; $("photoBox").hidden = true; $("photo").removeAttribute("src");
  $("card").hidden = false; mark(g.table);
  
  (document.querySelector(".tb.me") || $("card")).scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"});
}

/* 拆信：先確認 + 輸入桌號，桌號正確才解開信件並記錄已拆封 */
function askOpen(){
  $("terr").textContent = ""; $("tin").value = TEST && cur ? cur.table : "";
  $("modal").hidden = false; $("tin").focus();
}
async function tryOpen(){
  const g = cur; if(!g) return;
  const raw = $("tin").value.replace(/\D/g,"");
  if(!raw){ $("terr").textContent = "請先輸入桌號喔 🤍"; return; }
  const t = String(parseInt(raw,10)); $("myes").disabled = true;
  try{
    const j = JSON.parse(await unlock(g.rec.m, "m|" + g.name + "|" + t));
    $("modal").hidden = true; reveal(g, j);
  }catch(e){ $("terr").textContent = "桌號不太對喔，請再確認一下 🤍"; }
  $("myes").disabled = false;
}
function reveal(g, j){
  markOpened(g.rec.i);
  $("msg").textContent = j.m;
  const box = $("photoBox"), img = $("photo"); box.hidden = true; img.removeAttribute("src");
  if(j.p){ img.onload = () => { box.hidden = false; }; img.onerror = () => { box.hidden = true; }; img.src = j.p; }
  const env = $("env"); env.classList.add("open"); env.setAttribute("aria-expanded","true");
  burst(); $("envlabel").hidden = true; $("envhint").hidden = true; $("letter").classList.add("show");
  setTimeout(() => $("letter").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"nearest"}), 700);
}

function burst(){
  if(reduce) return;
  const r = $("env").getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2 - 10;
  const cols = ["#b23a4d","#d4566a","#d3ad63","#e9a8b3","#7fa38f"];
  for(let i=0;i<26;i++){
    const el = document.createElement("span"); el.className = "fx";
    if(i % 3 !== 0){ el.textContent = "♥"; el.style.color = cols[i%cols.length]; el.style.fontSize = (12+Math.random()*10)+"px"; }
    else { el.style.cssText = `width:7px;height:11px;background:${cols[i%cols.length]};border-radius:1px`; }
    document.body.appendChild(el);
    const a = Math.random()*Math.PI*2, d = 50+Math.random()*90;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 50, rot = (Math.random()-.5)*540;
    el.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.4) rotate(0)`,opacity:1},
      {transform:`translate(${cx+dx}px,${cy+dy}px) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.45},
      {transform:`translate(${cx+dx*1.15}px,${cy+dy+110}px) scale(.8) rotate(${rot}deg)`,opacity:0}
    ],{duration:1300+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = () => el.remove();
  }
}

$("env").addEventListener("click", () => { if(!$("env").classList.contains("open")) askOpen(); });
$("mno").addEventListener("click", () => { $("modal").hidden = true; });
$("myes").addEventListener("click", tryOpen);
$("tin").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); tryOpen(); } });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("modal").hidden = true; });
$("f").addEventListener("submit", e => { e.preventDefault(); run(); });
</script>
