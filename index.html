<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luka &amp; Grace · 婚禮座位查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Italiana&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eee9de;--card:#faf8f2;--ink:#2a2622;--soft:#7a7266;--line:#ddd4c4;--wax:#8c2536;--wax2:#b23a4d;--gold:#a8823a;--paper:#fffdf8;--env:#e8dfcd;--env2:#d9cdb7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--card:#1b2622;--ink:#eef0ea;--soft:#9fb0a7;--line:#2c3a35;--wax:#b23a4d;--wax2:#d4566a;--gold:#d3ad63;--paper:#f6f1e4;--env:#2b3a34;--env2:#22302b}}
:root[data-theme="dark"]{--bg:#121a17;--card:#1b2622;--ink:#eef0ea;--soft:#9fb0a7;--line:#2c3a35;--wax:#b23a4d;--wax2:#d4566a;--gold:#d3ad63;--paper:#f6f1e4;--env:#2b3a34;--env2:#22302b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(115deg,transparent 0 22%,rgba(255,255,255,.35) 30%,transparent 42% 60%,rgba(120,100,70,.07) 72%,transparent 85%),radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.5),transparent 55%),radial-gradient(ellipse at 90% 18%,rgba(150,125,85,.12),transparent 50%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);min-height:100vh}
main{max-width:460px;margin:0 auto}
header{text-align:center;margin:18px 0 34px}
h1{margin:0 0 26px;font-weight:400}
.wd{display:block;font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:clamp(24px,7vw,30px);letter-spacing:.05em;margin-bottom:40px}
.names{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3.5vw,22px);font-family:Italiana,"Noto Serif TC",serif;font-size:clamp(26px,8.2vw,40px);letter-spacing:.2em;margin-right:-.2em}
.names svg{width:clamp(22px,6vw,32px);height:auto;flex:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
header p{margin:0;color:var(--soft);font-size:15px;letter-spacing:.08em}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.search input:focus,.search button:focus-visible,.pick:focus-visible,.env:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.search button{font:inherit;font-weight:600;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);cursor:pointer}
.hint{color:var(--soft);font-size:14px;text-align:center;margin:18px 0}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick{font:inherit;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px 22px 24px;text-align:center}
.who{font-size:15px;color:var(--soft);margin:0}
.name{font-size:30px;font-weight:900;letter-spacing:.1em;margin:0 0 18px}
.seat{display:flex;justify-content:center;gap:28px;padding:16px 0;border-block:1px dashed var(--line)}
.seat b{display:block;font-size:44px;line-height:1.1;color:var(--wax);font-weight:900}
.seat span{font-size:14px;color:var(--soft)}
.note{font-size:14px;color:var(--soft);margin:14px 0 0}
.egg{margin-top:26px}
.env{position:relative;display:block;width:230px;height:150px;margin:0 auto;padding:0;border:0;background:none;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent}
.env .back,.env .front{position:absolute;inset:0;border-radius:6px}
.env .back{background:var(--env2);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.env .front{background:linear-gradient(var(--env),var(--env));clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);opacity:.96}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s cubic-bezier(.5,0,.2,1),z-index 0s .3s;z-index:3;filter:brightness(.97)}
.env .seal{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-34px 0 0 -25px;border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,var(--wax2),var(--wax) 70%);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12);display:grid;place-items:center;color:#f7dfe3;font-size:20px;transition:opacity .4s,transform .4s}
.env:hover .seal{transform:scale(1.07)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(1.5)}
.env-label{display:block;margin-top:14px;font-weight:600;letter-spacing:.06em}
.letter{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s ease .25s}
.letter.show{grid-template-rows:1fr}
.letter>div{overflow:hidden}
.paper{margin-top:20px;padding:26px 22px;background:var(--paper);color:#2b2a26;border-radius:6px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.16);border-top:4px solid var(--gold)}
.paper p{margin:0;font-size:17px;white-space:pre-line}
.paper .sign{margin-top:16px;text-align:right;color:var(--wax);font-weight:600}
.photo{margin:0 0 18px}
.photo img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:4px;border:6px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.2);transform:rotate(-1.5deg)}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform,opacity}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
  <h1><span class="wd">Wedding day</span><span class="names"><span>LUKA</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27C6 19 3 12 8 7.500c3-2.600 6.500-1.200 8 2.500 1.500-3.700 5-5.100 8-2.500 5 4.500 2 11.500-8 19.500z"/><path d="M15 25.500C7 19 4.500 13 9 9c2.500-2 5.500-.8 7 2.800"/></svg><span>GRACE</span></span></h1>
  <p>輸入姓名，找到你今天的位子</p>
</header>

<form class="search" id="f" role="search">
  <input id="q" type="search" placeholder="請輸入賓客姓名" autocomplete="off" aria-label="賓客姓名">
  <button type="submit">查詢</button>
</form>
<div class="picks" id="picks" hidden></div>
<p class="hint" id="hint">找不到名字嗎？試試只輸入姓或名，或向接待桌詢問。</p>

<section class="card" id="card" hidden aria-live="polite">
  <p class="who">歡迎你，</p>
  <h2 class="name" id="gname"></h2>
  <div class="seat">
    <div><b id="gtable"></b><span>桌次</span></div>
    <div><b id="gseat"></b><span>座位</span></div>
  </div>
  <p class="note" id="gnote"></p>

  <div class="egg" id="egg" hidden>
    <button class="env" id="env" type="button" aria-expanded="false" aria-controls="letter">
      <span class="back"></span><span class="front"></span><span class="flap"></span><span class="seal">♥</span>
    </button>
    <span class="env-label" id="envlabel">給你的專屬悄悄話 ✉️</span>
    <div class="letter" id="letter">
      <div><div class="paper">
        <figure class="photo" id="photoBox" hidden><img id="photo" alt="我們的回憶合照"></figure>
        <p id="msg"></p>
        <p class="sign">— Luka &amp; Grace</p>
      </div></div>
    </div>
  </div>
</section>
</main>

<script>
/* ====== 賓客資料：請在此編輯 ======
   name   姓名（可加 alias 別名陣列，如暱稱）
   table  桌次　seat 座位
   note   選填，給賓客的備註（如：靠近舞台）
   message 新人寫給此賓客的專屬悄悄話
   photo  回憶合照的圖片路徑或網址；留空 "" 則自動隱藏圖片框 */
const GUESTS = [
  {name:"王小明", alias:["小明","Ming"], table:"3", seat:"5", note:"靠近舞台右側", photo:"",
   message:"小明，大學四年的宿舍夜談，是我們最珍貴的回憶。\n謝謝你一路陪著我們，今天要吃飽喝足，不准提早離席！"},
  {name:"陳雅婷", alias:["雅婷","Tina"], table:"1", seat:"2", note:"主桌旁，方便上台致詞", photo:"photos/yating.jpg",
   message:"雅婷，沒有你當年的那通電話，我們不會有今天。\n這一桌的位子，我們特別留給最重要的你。"},
  {name:"林志豪", alias:["志豪"], table:"8", seat:"1", note:"", photo:"",
   message:"志豪，謝謝你從高雄趕來！\n今晚的酒，我們陪你喝到最後一杯。"},
  {name:"張美玲", alias:["美玲","阿姨"], table:"2", seat:"7", note:"", photo:"",
   message:"阿姨，謝謝你從小到大的疼愛。\n今天換我們說：謝謝你，愛你。"}
];

const $ = id => document.getElementById(id);
const norm = s => s.replace(/\s+/g,"").toLowerCase();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function search(v){
  v = norm(v); if(!v) return [];
  return GUESTS.filter(g => [g.name,...(g.alias||[])].some(n => norm(n).includes(v)));
}
function reset(){ $("card").hidden = true; $("picks").hidden = true; }
function run(){
  const r = search($("q").value);
  reset();
  if(!$("q").value.trim()){ $("hint").textContent = "請先輸入姓名喔。"; return; }
  if(r.length === 0){ $("hint").textContent = "查無此姓名，請確認名字或向接待桌詢問。"; $("hint").hidden = false; return; }
  if(r.length === 1) return show(r[0]);
  $("hint").textContent = "找到多位賓客，請點選你的名字：";
  const box = $("picks"); box.innerHTML = "";
  r.forEach(g => { const b = document.createElement("button"); b.type="button"; b.className="pick"; b.textContent=g.name; b.onclick=()=>show(g); box.appendChild(b); });
  box.hidden = false;
}
function show(g){
  $("hint").hidden = true; $("picks").hidden = true;
  $("gname").textContent = g.name; $("gtable").textContent = g.table; $("gseat").textContent = g.seat;
  $("gnote").textContent = g.note || ""; $("gnote").hidden = !g.note;
  const env = $("env"); env.classList.remove("open"); env.setAttribute("aria-expanded","false");
  $("letter").classList.remove("show"); $("envlabel").hidden = false;
  /* 專屬彩蛋：有 message 才顯示信封 */
  $("egg").hidden = !g.message; $("msg").textContent = g.message || "";
  /* 照片：沒設定或載入失敗，就隱藏圖片框 */
  const box = $("photoBox"), img = $("photo"); box.hidden = true; img.removeAttribute("src");
  if(g.photo){
    img.onload = () => { box.hidden = false; };
    img.onerror = () => { box.hidden = true; };
    img.src = g.photo;
  }
  $("card").hidden = false;
  $("card").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
}

function burst(){
  if(reduce) return;
  const r = $("env").getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2 - 10;
  const items = ["♥","♥","♥","✦"], cols = ["#b23a4d","#d4566a","#d3ad63","#e9a8b3","#7fa38f"];
  for(let i=0;i<26;i++){
    const el = document.createElement("span"); el.className = "fx";
    const heart = i % 3 !== 0;
    el.textContent = heart ? items[i%items.length] : "";
    if(!heart){ el.style.cssText = `width:7px;height:11px;background:${cols[i%cols.length]};border-radius:1px`; }
    else { el.style.color = cols[i%cols.length]; el.style.fontSize = (12+Math.random()*10)+"px"; }
    document.body.appendChild(el);
    const a = Math.random()*Math.PI*2, d = 50+Math.random()*90;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 50, rot = (Math.random()-.5)*540;
    el.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.4) rotate(0)`,opacity:1},
      {transform:`translate(${cx+dx}px,${cy+dy}px) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.45},
      {transform:`translate(${cx+dx*1.15}px,${cy+dy+110}px) scale(.8) rotate(${rot}deg)`,opacity:0}
    ],{duration:1300+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = () => el.remove();
  }
}
$("env").addEventListener("click", () => {
  const env = $("env"); if(env.classList.contains("open")) return;
  env.classList.add("open"); env.setAttribute("aria-expanded","true");
  burst(); $("envlabel").hidden = true;
  $("letter").classList.add("show");
  setTimeout(() => $("letter").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"nearest"}), 700);
});
$("f").addEventListener("submit", e => { e.preventDefault(); run(); });
</script>
</body>
</html>
