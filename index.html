<style>
:root{--bg:#eee9de;--card:#faf8f2;--ink:#2a2622;--soft:#7a7266;--line:#ddd4c4;--wax:#8c2536;--wax2:#b23a4d;--gold:#a8823a;--paper:#fffdf8;--env:#e8dfcd;--env2:#d9cdb7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--card:#1b2622;--ink:#eef0ea;--soft:#9fb0a7;--line:#2c3a35;--wax:#b23a4d;--wax2:#d4566a;--gold:#d3ad63;--paper:#f6f1e4;--env:#2b3a34;--env2:#22302b}}
:root[data-theme="dark"]{--bg:#121a17;--card:#1b2622;--ink:#eef0ea;--soft:#9fb0a7;--line:#2c3a35;--wax:#b23a4d;--wax2:#d4566a;--gold:#d3ad63;--paper:#f6f1e4;--env:#2b3a34;--env2:#22302b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(115deg,transparent 0 22%,rgba(255,255,255,.35) 30%,transparent 42% 60%,rgba(120,100,70,.07) 72%,transparent 85%),radial-gradient(ellipse at 15% 0%,rgba(255,255,255,.5),transparent 55%),radial-gradient(ellipse at 90% 18%,rgba(150,125,85,.12),transparent 50%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.75;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);min-height:100vh}
main{max-width:460px;margin:0 auto}
header{text-align:center;margin:18px 0 34px}
h1{margin:0 0 26px;font-weight:400}
.wd{display:block;font-family:Lora,"Noto Sans TC",serif;font-weight:500;font-size:clamp(24px,7vw,30px);letter-spacing:.06em;margin-bottom:40px}
.names{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,20px)}
.names svg{flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.nm{height:clamp(26px,9vw,44px);width:auto;stroke-width:2.2;overflow:visible}
.hrt{width:clamp(22px,6vw,30px);height:auto;stroke-width:1.2}
header p{margin:0;color:var(--soft);font-size:15px;letter-spacing:.08em}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.search input:focus,.search button:focus-visible,.pick:focus-visible,.env:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.search button{font:inherit;font-weight:600;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);cursor:pointer}
.hint{color:var(--soft);font-size:14px;text-align:center;margin:18px 0}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick{font:inherit;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px 22px 24px;text-align:center}
.who{font-size:15px;color:var(--soft);margin:0}
.name{font-size:30px;font-weight:900;letter-spacing:.1em;margin:0 0 18px}
.seat{display:flex;justify-content:center;gap:28px;padding:16px 0;border-block:1px dashed var(--line)}
.seat b{display:block;font-size:44px;line-height:1.1;color:var(--wax);font-weight:900}
.seat span{font-size:14px;color:var(--soft)}
.note{font-size:14px;color:var(--soft);margin:14px 0 0}
.egg{margin-top:26px}
.env{position:relative;display:block;width:230px;height:150px;margin:0 auto;padding:0;border:0;background:none;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent}
.env .back,.env .front{position:absolute;inset:0;border-radius:6px}
.env .back{background:var(--env2);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.env .front{background:linear-gradient(var(--env),var(--env));clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);opacity:.96}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s cubic-bezier(.5,0,.2,1),z-index 0s .3s;z-index:3;filter:brightness(.97)}
.env .seal{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-34px 0 0 -25px;border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,var(--wax2),var(--wax) 70%);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12);display:grid;place-items:center;color:#f7dfe3;font-size:20px;transition:opacity .4s,transform .4s}
.env:hover .seal{transform:scale(1.07)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(1.5)}
.env-label{display:block;margin-top:14px;font-weight:600;letter-spacing:.06em}
.letter{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s ease .25s}
.letter.show{grid-template-rows:1fr}
.letter>div{overflow:hidden}
.paper{margin-top:20px;padding:26px 22px;background:var(--paper);color:#2b2a26;border-radius:6px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.16);border-top:4px solid var(--gold)}
.paper p{margin:0;font-size:17px;white-space:pre-line}
.paper .sign{margin-top:16px;text-align:right;color:var(--wax);font-weight:600}
.photo{margin:0 0 18px}
.photo img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:4px;border:6px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.2);transform:rotate(-1.5deg)}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform,opacity}
.map{margin-top:22px;text-align:center}
.mhead{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;text-align:left}
.mhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.1em}
.mhead p{margin:0;font-size:13px;color:var(--soft)}
.plate{width:68px;height:68px;flex:none}
.bow{display:block;width:92px;margin:0 auto 4px}
.stg{font-size:12px;color:var(--soft);margin:0 0 12px;letter-spacing:.2em}
.floor{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;max-width:230px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:28px}
.strip{width:58px;margin:0 auto;padding:0 12px;border-radius:6px;background:radial-gradient(circle,#a63a46 2.4px,transparent 2.8px) 3px 0/9px 15px repeat-y,radial-gradient(circle,#a63a46 2.4px,transparent 2.8px) calc(100% - 3px) 0/9px 15px repeat-y,linear-gradient(#8f9d78,#8f9d78) 8px 0/1.5px 100% no-repeat,linear-gradient(#8f9d78,#8f9d78) calc(100% - 8px) 0/1.5px 100% no-repeat}
.tb{height:26px;display:grid;place-items:center;background:var(--paper);color:#2b2a26;border:1px solid #d6b9b0;font-family:Caveat,cursive;font-weight:700;font-size:18px;line-height:1}
.tb+.tb{border-top:0}
.tb.me{position:relative;z-index:2;background:var(--wax);color:#fff;border-color:var(--wax);transform:scale(1.2);box-shadow:0 0 0 3px var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(168,130,58,.28)}}
@media (prefers-reduced-motion:reduce){.tb.me{animation:none}}
.opened{margin:26px 0 0;padding:16px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--soft);text-align:center}
#testbar{position:fixed;top:0;left:0;right:0;z-index:70;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;text-align:center;font-size:12px;background:#fdf3c8;color:#6b5a1a;border-bottom:1px solid #e8d78a}
body.t{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(20,16,12,.5)}
.modal .box{max-width:320px;background:var(--card);border-radius:18px;padding:26px 22px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal p{margin:0;font-size:17px;font-weight:500}
.modal p.sub{margin-top:10px;font-size:14px;font-weight:400;color:var(--soft)}
.tin{width:100%;margin-top:12px;font:inherit;font-size:24px;text-align:center;letter-spacing:.4em;padding:9px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:#2b2a26}
.modal p.terr{margin:8px 0 0;min-height:1.5em;font-size:14px;font-weight:500;color:var(--wax)}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;font:inherit;padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btns .go{background:var(--wax);border-color:var(--wax);color:#fff;font-weight:700}
.foot{margin-top:36px;text-align:center;font-size:14px;color:var(--soft)}
.foot p{margin:0 0 6px}
.foot .fl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.foot a{padding:7px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.foot a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.env:not(.open){animation:wig 4s ease-in-out infinite;transform-origin:50% 85%}
.env:not(.open)::after{content:"";position:absolute;inset:0;border-radius:6px;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(244,214,140,.6) 50%,transparent 62%) 100% 0/300% 100% no-repeat;animation:sheen 3s ease-in-out infinite}
.env:not(.open) .seal{animation:glow 2.4s ease-in-out infinite}
.env:not(.open) .seal::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,238,190,.85) 50%,transparent 62%) 100% 0/300% 100% no-repeat;animation:sheen 3s ease-in-out .12s infinite}
@keyframes sheen{0%{background-position:100% 0}45%,100%{background-position:0 0}}
@keyframes wig{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(-2.2deg)}74%{transform:rotate(2.2deg)}80%{transform:rotate(-1.4deg)}86%{transform:rotate(1.4deg)}92%{transform:rotate(0)}}
@keyframes glow{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12),0 0 5px 1px rgba(232,196,110,.2)}50%{box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12),0 0 18px 7px rgba(232,196,110,.6)}}
.env-hint{display:block;margin-top:4px;font-size:14px;color:var(--soft);letter-spacing:.06em;animation:hf 2.4s ease-in-out infinite}
@keyframes hf{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.env,.env::after,.env .seal,.env .seal::after,.env-hint{animation:none!important}}
[hidden]{display:none!important}
</style>

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 測試模式：網址含 ?test=1（或 #test）才啟用；正式網址完全不顯示 */
const TEST = (() => { try { return new URLSearchParams(location.search).get("test") === "1" || location.hash === "#test"; } catch(e){ return false; } })();
if(TEST){ $("testbar").hidden = false; document.body.classList.add("t"); }

/* 拆封紀錄（測試模式一律忽略、也不寫入） */
const STORAGE_VERSION = "v1";  /* 正式發佈前改成 v2、v3… 即可讓所有舊的拆封紀錄失效 */
const KEY = id => "wedding-opened-" + STORAGE_VERSION + ":" + id;
function wasOpened(id){ if(TEST) return false; try{ return localStorage.getItem(KEY(id)) === "1"; }catch(e){ return false; } }
function markOpened(id){ if(TEST) return; try{ localStorage.setItem(KEY(id), "1"); }catch(e){} }

/* 解密工具（名單與信件在原始碼中皆為密文） */
const SALT = new TextEncoder().encode("luka-grace-2026"), TE = new TextEncoder(), TD = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function idOf(name){
  const h = await crypto.subtle.digest("SHA-256", TE.encode("id|" + name));
  return [...new Uint8Array(h)].slice(0,12).map(x => x.toString(16).padStart(2,"0")).join("");
}
async function unlock(blob, pw){
  const km = await crypto.subtle.importKey("raw", TE.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const raw = b64(blob);
  return TD.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0,12)}, key, raw.slice(12)));
}

/* 座位圖 */
[[[16,22],[23,29]],[[1,7],[8,14]]].forEach(col => {
  const c = document.createElement("div"); c.className = "col";
  col.forEach(([a,b]) => {
    const s = document.createElement("div"); s.className = "strip";
    for(let n=a;n<=b;n++){ const t = document.createElement("div"); t.className = "tb"; t.dataset.t = n; t.textContent = n; s.appendChild(t); }
    c.appendChild(s);
  });
  $("floor").appendChild(c);
});
function mark(t){
  document.querySelectorAll(".tb.me").forEach(e => e.classList.remove("me"));
  const el = t && document.querySelector('.tb[data-t="'+t+'"]'); if(el) el.classList.add("me");
}

let cur = null, seq = 0;
const NOTFOUND = "找不到名字或有任何問題，請當天現場詢問✨";
function say(t){ const h = $("hint"); h.textContent = t; h.hidden = false; }
async function run(){
  const v = $("q").value.normalize("NFC").trim(), my = ++seq;
  mark(null); $("card").hidden = true; cur = null;
  if(!v){ say("請先輸入姓名喔。"); return; }
  if(!(window.crypto && crypto.subtle)){ say(NOTFOUND); return; }
  try{
    const id = await idOf(v), rec = DATA.find(r => r.i === id);
    if(!rec){ if(my === seq) say(NOTFOUND); return; }
    const table = await unlock(rec.t, "n|" + v);   /* 名字不對就解不開 */
    if(my === seq) show({name:v, table, rec});
  }catch(e){ if(my === seq) say(NOTFOUND); }
}
function show(g){
  cur = g; $("hint").hidden = true;
  $("gname").textContent = g.name; $("gtable").textContent = g.table;
  const done = wasOpened(g.rec.i);
  const env = $("env"); env.classList.remove("open"); env.setAttribute("aria-expanded","false");
  $("letter").classList.remove("show"); $("envlabel").hidden = false; $("envhint").hidden = false;
  $("egg").hidden = done; $("opened").hidden = !done;
  $("msg").textContent = ""; $("photoBox").hidden = true; $("photo").removeAttribute("src");
  $("card").hidden = false; mark(g.table);
  (document.querySelector(".tb.me") || $("card")).scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"});
}

/* 拆信：先確認 + 輸入桌號，桌號正確才解開信件並記錄已拆封 */
function askOpen(){
  $("terr").textContent = ""; $("tin").value = TEST && cur ? cur.table : "";
  $("modal").hidden = false; $("tin").focus();
}
async function tryOpen(){
  const g = cur; if(!g) return;
  const raw = $("tin").value.replace(/\D/g,"");
  if(!raw){ $("terr").textContent = "請先輸入桌號喔 🤍"; return; }
  const t = String(parseInt(raw,10)); $("myes").disabled = true;
  try{
    const j = JSON.parse(await unlock(g.rec.m, "m|" + g.name + "|" + t));
    $("modal").hidden = true; reveal(g, j);
  }catch(e){ $("terr").textContent = "桌號不太對喔，請再確認一下 🤍"; }
  $("myes").disabled = false;
}
function reveal(g, j){
  markOpened(g.rec.i);
  $("msg").textContent = j.m;
  const box = $("photoBox"), img = $("photo"); box.hidden = true; img.removeAttribute("src");
  if(j.p){ img.onload = () => { box.hidden = false; }; img.onerror = () => { box.hidden = true; }; img.src = j.p; }
  const env = $("env"); env.classList.add("open"); env.setAttribute("aria-expanded","true");
  burst(); $("envlabel").hidden = true; $("envhint").hidden = true; $("letter").classList.add("show");
  setTimeout(() => $("letter").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"nearest"}), 700);
}

function burst(){
  if(reduce) return;
  const r = $("env").getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2 - 10;
  const cols = ["#b23a4d","#d4566a","#d3ad63","#e9a8b3","#7fa38f"];
  for(let i=0;i<26;i++){
    const el = document.createElement("span"); el.className = "fx";
    if(i % 3 !== 0){ el.textContent = "♥"; el.style.color = cols[i%cols.length]; el.style.fontSize = (12+Math.random()*10)+"px"; }
    else { el.style.cssText = `width:7px;height:11px;background:${cols[i%cols.length]};border-radius:1px`; }
    document.body.appendChild(el);
    const a = Math.random()*Math.PI*2, d = 50+Math.random()*90;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 50, rot = (Math.random()-.5)*540;
    el.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.4) rotate(0)`,opacity:1},
      {transform:`translate(${cx+dx}px,${cy+dy}px) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.45},
      {transform:`translate(${cx+dx*1.15}px,${cy+dy+110}px) scale(.8) rotate(${rot}deg)`,opacity:0}
    ],{duration:1300+Math.random()*600,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = () => el.remove();
  }
}

$("env").addEventListener("click", () => { if(!$("env").classList.contains("open")) askOpen(); });
$("mno").addEventListener("click", () => { $("modal").hidden = true; });
$("myes").addEventListener("click", tryOpen);
$("tin").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); tryOpen(); } });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("modal").hidden = true; });
$("f").addEventListener("submit", e => { e.preventDefault(); run(); });
</script>
